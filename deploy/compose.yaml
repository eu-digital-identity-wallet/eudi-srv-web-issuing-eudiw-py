# The PID issuer, its authorization server, and their Postgres.
# See deploy/README.md. Use the Deploy workflow, not compose directly: both
# configs are rendered before compose runs.
#
# proxy-net belongs to eudi-srv-wallet-provider and must be up first.

name: eudiw-issuer

services:

  postgres:
    # 16, matching what install.md states the issuer was tested against.
    image: postgres:16.14-alpine
    container_name: eudiw-issuer-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?repository secret, see deploy/README.md}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-eudiw_issuer}
    volumes:
      # Correct up to 17; 18 moved this to /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # CMD, not CMD-SHELL: the shell form drops the arguments.
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USER:-postgres}", "-d", "${DATABASE_NAME:-eudiw_issuer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - issuer

  oidc:
    image: ${OIDC_IMAGE:?set by the deploy workflow}
    container_name: eudiw-oidc
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      VIRTUAL_HOST: ${ISSUER_HOST:?set in stack.env}
      VIRTUAL_PORT: "5000"
      VIRTUAL_PATH: ${OIDC_PATH:?set in stack.env}
      # Strips the prefix: the app serves at its own root.
      VIRTUAL_DEST: /
      LETSENCRYPT_HOST: ${ISSUER_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set in stack.env}
      # Unused by the app: a new wallet provider certificate changes it, so
      # compose recreates the server.
      WALLET_PROVIDER_CERT_SHA256: ${WALLET_PROVIDER_CERT_SHA256:?set by the deploy workflow}
    # /app exists in the image, /etc/issuer_config does not.
    command: ["python3", "server.py", "/app/authorization_config.json"]
    configs:
      - source: oidc-config
        target: /app/authorization_config.json
      # Over the shipped copy, which names upstream's host: the well-known
      # routes send this file as-is and config.json never reaches it.
      - source: oidc-metadata
        target: /app/openid-configuration.json
      # The trusted wallet attester, in trusted_attesters_path. Only used when
      # the config names no wallet providers list.
      - source: wallet-provider-cert
        target: /etc/eudiw/pid-issuer-dev/oidc_trusted_attesters/wallet-provider.pem
      # The CAs the wallet providers list must be signed under (lote_signer_ca_path).
      - source: ec-lote-signer-cas
        target: /etc/eudiw/pid-issuer-dev/oidc_lote/ec-lote-signer-cas.pem
    networks:
      # The alias is what OIDC_INTERNAL_URL dials.
      proxy-net:
      issuer:
        aliases: [oidc]

  # Unpacks the document-signing material into a named volume. Idempotent.
  pki-init:
    image: ${ISSUER_IMAGE:?set by the deploy workflow}
    container_name: eudiw-issuer-pki-init
    restart: "no"
    # base64 so compose does not interpolate the script's shell variables.
    # deploy/pki-init.sh is the source; the deploy workflow encodes it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "$$PKI_INIT_B64" | base64 -d > /tmp/pki-init.sh && sh /tmp/pki-init.sh
    environment:
      PKI_INIT_B64: ${PKI_INIT_B64:?set by the deploy workflow}
      # Document signer and IACA certificates; the key is the ds-key secret.
      DS_CERT_PEM: ${DS_CERT_PEM:?from WEBUILD/pki/leaves/pid-ds-gr-01/pid-ds-gr-01.crt, see deploy/README.md}
      IACA_PEM: ${IACA_PEM:?from WEBUILD/pki/ca/root-ca-grnet.pem, see deploy/README.md}
      # Optional PID SD-JWT signer, the WE BUILD-onboarded certificate; the key is
      # the pid-sd-jwt-key secret. Empty: the document signer signs everything.
      PID_SD_JWT_CERT_PEM: ${PID_SD_JWT_CERT_PEM:-}
      # Optional registrar WRPAC and WRPRC; the WRPAC key is the wrp-access-key
      # secret. Empty: the document signer signs the metadata, no issuer_info.
      WRP_ACCESS_CERT_PEM: ${WRP_ACCESS_CERT_PEM:-}
      WRP_REGISTRATION_CERT: ${WRP_REGISTRATION_CERT:-}
    secrets:
      - ds-key
      - pid-sd-jwt-key
      - wrp-access-key
    volumes:
      - pki:/etc/eudiw/pid-issuer-dev
    networks:
      - issuer

  issuer:
    image: ${ISSUER_IMAGE:?set by the deploy workflow}
    container_name: eudiw-issuer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
    expose:
      - "5000"
    environment:
      VIRTUAL_HOST: ${ISSUER_HOST}
      VIRTUAL_PORT: "5000"
      VIRTUAL_PATH: ${ISSUER_PATH:?set in stack.env}
      VIRTUAL_DEST: /
      LETSENCRYPT_HOST: ${ISSUER_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # /app exists in the image; /etc/issuer_config does not.
      ISSUER_CONFIG_PATH: /app/config_issuer_backend.yaml
      # Unused by the app: a new signer changes it, so compose recreates the issuer.
      DS_CERT_SHA256: ${DS_CERT_SHA256:?set by the deploy workflow}
      # Likewise for the metadata signer and issuer_info: the issuer reads both at
      # startup, so a change must recreate it.
      WRP_SHA256: ${WRP_SHA256:-}
    configs:
      - source: issuer-config
        target: /app/config_issuer_backend.yaml
    volumes:
      # Named: the generated keys must survive a redeploy, and the issuer's
      # published JWK is derived from credential_request.pem.
      - pki:/etc/eudiw/pid-issuer-dev:ro
    networks:
      - proxy-net
      - issuer

  # The CRL named in the IACA's crlDistributionPoints, and the IACA itself.
  # Static files: stock nginx and two configs, nothing built here. Belongs to
  # this stack because the IACA is the root above the issuer's document signer;
  # the issuer never fetches the CRL itself.
  crl:
    image: nginx:1.29.1-alpine
    # The edge's plain-http location dials this name.
    container_name: eudiw-crl
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # Two paths: the CRL, and the IACA for partners. No prefix stripping: the
      # files sit under the prefixes, so this https route and the edge's http
      # one forward the same URI unchanged.
      VIRTUAL_HOST_MULTIPORTS: |-
        ${ISSUER_HOST}:
          "${CRL_PATH:?set in stack.env}":
            port: 80
            dest: "${CRL_PATH}"
          "${PKI_PATH:?set in stack.env}":
            port: 80
            dest: "${PKI_PATH}"
      #
      # Deliberately no HTTPS_METHOD. nginx-proxy applies it per hostname, taking
      # the first container that sets it, so noredirect here would drop the https
      # redirect and HSTS for every service on the host. The CRL's plain-http
      # exception lives in the edge instead, see eudi-srv-wallet-provider.
      LETSENCRYPT_HOST: ${ISSUER_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Public data, not secrets. The deploy workflow derives both from the
      # CRL_PEM and IACA_PEM repository variables.
      #
      # Environment rather than configs on purpose: compose recreates a container
      # when its environment changes but not when a config's content does, so
      # this way a CRL refresh rolls out on a plain deploy, and only this
      # container restarts.
      CRL_DER_B64: ${CRL_DER_B64:?converted from WEBUILD/pki/crl/crl.pem, see deploy/README.md}
      IACA_PEM: ${IACA_PEM:?from WEBUILD/pki/ca/root-ca-grnet.pem, see deploy/README.md}
    # RFC 5280 4.2.1.13: an http distribution point must return one DER-encoded
    # CRL, whatever the URL is called. openssl and Go refuse PEM there; Java takes
    # either. DER has bytes an environment variable cannot carry, so it arrives
    # base64 and is decoded here. Replaces the image's entrypoint, whose only job
    # is templating we do not use.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        crl=/usr/share/nginx/html${CRL_PATH}
        pki=/usr/share/nginx/html${PKI_PATH}
        mkdir -p "$$crl" "$$pki"
        printf '%s' "$$CRL_DER_B64" | base64 -d > "$$crl/crl.pem"
        printf '%s\n' "$$IACA_PEM" > "$$pki/root-ca-grnet.pem"
        exec nginx -g 'daemon off;'
    configs:
      - source: crl-nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - proxy-net

configs:
  # Rendered from deploy/config_issuer_backend.yaml.template.
  issuer-config:
    content: ${ISSUER_CONFIG:?rendered by the deploy workflow}

  # Rendered by deploy/render-oidc-config.py from the OIDC image's own config.
  oidc-config:
    content: |
      ${OIDC_CONFIG_JSON:?run deploy/render-oidc-config.py, see deploy/README.md}

  # Rendered by deploy/render-oidc-metadata.py from the OIDC image's own copy.
  # Only changes with the image or OIDC_PUBLIC_URL, and either of those changes
  # the service too, so compose's not-recreating-on-content-change is moot here.
  oidc-metadata:
    content: |
      ${OIDC_METADATA_JSON:?run deploy/render-oidc-metadata.py, see deploy/README.md}

  # Stock nginx serves .pem as application/x-x509-ca-cert. RFC 2585 names
  # application/pkix-crl for a DER CRL, and strict clients check.
  crl-nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          location = ${CRL_PATH}crl.pem {
              types { }
              default_type application/pkix-crl;
          }
      }

  # The wallet provider's signing certificate, from its /jwks.
  wallet-provider-cert:
    content: ${WALLET_PROVIDER_CERT_PEM:?set by the deploy workflow}

  # The Commission's LoTE signing chain, deploy/ec-lote-signer-cas.pem. Content,
  # not file: a file config is a bind mount from this machine, which a remote
  # DOCKER_HOST does not have.
  ec-lote-signer-cas:
    content: ${EC_LOTE_SIGNER_CAS_PEM:?from deploy/ec-lote-signer-cas.pem, set by the deploy workflow}

secrets:
  # Document signer key. A secret, so `docker inspect` does not show it.
  ds-key:
    environment: DS_KEY_PEM
  # PID SD-JWT signer key. PID_SD_JWT_KEY_PEM must be set, empty if there is
  # none: compose refuses a secret whose variable is unset.
  pid-sd-jwt-key:
    environment: PID_SD_JWT_KEY_PEM
  # Registrar WRPAC key, for the signed metadata. WRP_ACCESS_KEY_PEM must be set,
  # empty if there is none, as above.
  wrp-access-key:
    environment: WRP_ACCESS_KEY_PEM

volumes:
  pki:
  # Attestation status, created by the issuer at startup.
  postgres-data:

networks:
  proxy-net:
    external: true
    name: proxy-net
  # Private: postgres and the issuer-to-oidc hop.
  issuer:
    name: eudiw-issuer

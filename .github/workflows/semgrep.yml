# Semgrep with the repository's own rules in .semgrep/ (fails on findings; tests excluded).
# Runs on every push, pull request and manual dispatch. Needs secrets: none.
name: Semgrep
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Security rules (.semgrep/)
        run: |
          pip install semgrep==1.179.0
          semgrep --config .semgrep/ --metrics=off --error --exclude tests .
